[project]
name = "image-audit"
version = "0.1.0"
description = "Image placement audit tool for travel affiliate pages"
requires-python = ">=3.11"
dependencies = [
    "playwright",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
